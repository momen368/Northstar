services:
  - type: web
    name: northstar-momen368
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/database
    disk:
      name: northstar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/ai_resume_analyzer.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
