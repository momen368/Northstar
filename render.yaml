services:
  - type: web
    name: northstar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/database
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/northstar-uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: SESSION_TTL_HOURS
        value: "24"
