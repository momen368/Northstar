<body data-page="register"><header class="topbar public-nav"><a class="brand" href="/">Northstar<span> / career intelligence</span></a><nav><a href="/login.html">Sign in</a></nav><select class="theme-select" data-theme-control aria-label="Color theme"><option value="dark">Dark mode</option><option value="light">Light mode</option><option value="glass">Glass mode</option></select></header><main class="auth-layout"><section class="auth-aside"><p class="eyebrow">START WITH YOUR EXPERIENCE</p><h1>A working space<br>for your next chapter.</h1><p>Your materials stay tied to your account. Career suggestions use your resume and available reference sources.</p></section><section class="auth-panel"><p class="eyebrow">CREATE YOUR ACCOUNT</p><h2>Get started</h2><div id="notice" class="notice" hidden></div><form id="register-form"><label>Name<input name="name" autocomplete="name" required minlength="1" maxlength="120"></label><label>Email<input name="email" type="email" autocomplete="email" required maxlength="320"></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><small>Use at least 12 characters, including a letter and a number.</small></label><button class="button primary" type="submit">Create account <span aria-hidden="true">↗</span></button></form><p class="form-foot">Already registered? <a href="/login.html">Sign in</a></p></section></main><script type="module" src="/assets/js/app.js"></script></body></html>
