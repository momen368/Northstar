<body data-page="jobs"><header class="topbar"><a class="brand" href="/dashboard.html">Northstar<span> / workspace</span></a><nav class="app-nav"><a href="/dashboard.html">Overview</a><a href="/resume.html">Resume</a><a aria-current="page" href="/jobs.html">Jobs</a><a href="/advisor.html">Advisor</a></nav><select class="theme-select" data-theme-control aria-label="Color theme"><option value="dark">Dark mode</option><option value="light">Light mode</option><option value="glass">Glass mode</option></select><button class="quiet-button" data-logout>Sign out</button></header><main class="app-main"><div class="page-heading"><div><p class="eyebrow">OPPORTUNITY TRACKER</p><h1>Keep the right roles close.</h1><p class="lede">Manage your listings and search by title, company, location, experience, or skill.</p></div></div><div id="page-notice" class="notice" hidden></div><section class="panel"><form id="job-search-form" class="search-form"><label class="search-keyword">Keyword<input name="keyword" placeholder="Title, company, or description"></label><label>Location<input name="location" placeholder="Any location"></label><label>Experience<select name="experience_level"><option value="">Any level</option><option>entry-level</option><option>junior</option><option>mid</option><option>senior</option><option>lead</option></select></label><label>Skill<input name="skill" placeholder="e.g. Python"></label><button class="button primary" type="submit">Search</button></form></section><section class="jobs-layout"><section><div class="panel-heading"><div><p class="eyebrow">YOUR LISTINGS</p><h2>Jobs</h2></div><span id="job-count" class="muted"></span></div><div id="job-list" class="record-list" data-loading="Loading jobs…"></div></section><aside class="panel"><p class="eyebrow">ADD OPPORTUNITY</p><h2>New job</h2><form id="job-create-form"><label>Title<input name="title" required minlength="2" maxlength="200"></label><label>Company<input name="company" required maxlength="200"></label><label>
